  sections:
    summary:
      - "Ph.D. candidate in Mechanical Engineering focused on physics-informed, data-driven modeling and control methods for unconventional robotic platforms, including off-road ground vehicles on deformable terrain and fish-like robots with internal actuation. I genuinely enjoy building and testing robots, and I am especially interested in autonomy that works outside the lab in messy, real environments. My research blends first principles dynamics, multi-modal sensing, and data-driven system identification to build control-oriented predictive models, and I use optimization and learning based control to translate these models into reliable, real-time robot behavior under uncertainty."
