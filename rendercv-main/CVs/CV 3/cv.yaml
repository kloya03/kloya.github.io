    research_experience:
      - company: "Virtual Prototyping of Ground Vehicle Systems Center (VIPR-GS)"
        position: "Graduate Research Assistant"
        start_date: "2024-09"
        end_date: "present"
        location: "Clemson, SC, USA"
        highlights:
          - "Developed a physics-informed, data-driven Koopman learning framework for off-road vehicle mobility on deformable terrain, enabling control-oriented prediction without expensive online terramechanics evaluations."
          - "Identified soil-specific lifted linear predictors using scalable recursive subspace identification, with data prioritization to capture regime changes from large simulation datasets."
          - "Integrated the learned predictor into constrained MPC to achieve reliable real-time tracking of aggressive trajectories under steering and torque limits."
      - company: "Applied Dynamical Systems Lab"
        position: "Graduate Research Assistant"
        start_date: "2021-08"
        end_date: "2024-05"
        location: "Clemson, SC, USA"
        highlights:
          - "Developed a linear predictor for high-dimensional nonlinear systems using Koopman operator and subspace identification methods."
          - "Demonstrated effective control in systems like the hydrodynamic Chaplygin sleigh by applying adaptive control for accurate system stabilization and trajectory tracking."
          - "Created an online learning framework for updating Koopman operators from streaming data across different dynamical regimes using Gaussian processes as basis functions."
          - "Investigated the roll dynamics of a hydrodynamic Chaplygin sleigh, analyzing how parametric oscillations and nonholonomic constraints affect the stability of bioinspired underwater robots."
          - "Designed and developed a fish-inspired robot with internal rotor actuation, applying data-driven methods (Koopman operator and RL) for its modeling and control."
      - company: "Virtual Prototyping of Ground Vehicle Systems Center (VIPR-GS)"
        position: "Graduate Research Assistant"
        start_date: "2020-01"
        end_date: "2021-08"
        location: "Clemson, SC, USA"
        highlights:
          - "Designed energy-efficient planning and control strategies for UAV fleets in resource-constrained environments."
          - "Used MPC to enhance UAV energy efficiency, factoring in disturbances, wind effects, and morphed UAV for improved performance."
