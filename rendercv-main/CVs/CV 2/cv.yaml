  sections:
    summary:
      - "Ph.D. candidate in Mechanical Engineering focused on physics-informed, data-driven modeling and control methods for unconventional robotic platforms, including off-road ground vehicles on deformable terrain and fish-like robots with internal actuation. Passionate about building and testing robots with an emphasis on autonomy that operates reliably in complex, messy environments outside the lab. Research blends first-principles dynamics, multi-modal sensing, and data-driven system identification to construct control-oriented predictive models, utilizing optimization and learning-based control for real-time robotic behavior under uncertainty."

