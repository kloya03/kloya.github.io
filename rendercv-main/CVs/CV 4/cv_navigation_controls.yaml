  sections:
    summary:
      - Robotics and controls researcher with hands-on experience building, integrating, and field-testing physical robots. Developed and deployed real-time model predictive control (MPC) and learned controllers for trajectory tracking, achieving 1.8–6.3 cm cross-track RMSE on an underwater robot. Experience spans vehicle dynamics, localization and state estimation, sensor and actuator integration, and sim-to-real learning. Mechanical Engineering Ph.D. expected in 2026; programming in C++, Python, and MATLAB.
    robotics_research_experience:
      - company: "Virtual Prototyping of Ground Vehicle Systems Center (VIPR-GS)"
        position: "Graduate Research Assistant"
        start_date: "2024-09"
        end_date: "present"
        location: "Clemson, SC, USA"
        highlights:
          - Integrated learned vehicle dynamics with constrained MPC for aggressive off-road trajectory tracking under steering and torque limits, achieving 85 ms per optimization step.
          - Currently integrating the framework on a 1/10th-scale autonomous off-road vehicle with a depth camera, wheel encoders, IMU, and GPS for onboard perception, state estimation, and closed-loop control.
          - Built fast, terrain-specific vehicle-dynamics predictors from large-scale simulation data using physics-informed Koopman learning for control on deformable terrain.
          - Evaluated dynamics models across unseen soil conditions, identifying performance degradation that motivates terrain-adaptive modeling and control.
        summary: "Advisor: Prof. Phanindra Tallapragada\n\nData-driven Koopman Control-Oriented Learning Framework for Improved Autonomous Offroad Mobility"
      - company: "Applied Dynamical Systems Lab"
        position: "Graduate Research Assistant"
        start_date: "2021-08"
        end_date: "2024-05"
        location: "Clemson, SC, USA"
        highlights:
          - Deployed real-time MPC and learned controllers on a physical underwater robot, achieving 1.8–6.3 cm cross-track RMSE and speeds up to 2 body lengths/s with low-level BLDC motor and servo control.
          - Designed, built, and field-tested the robot in pool and lake environments; integrated internal-rotor propulsion, a servo-actuated tail, onboard compute, IMU, pressure sensors, GPS, and overhead vision-based marker tracking for localization and state estimation.
          - Developed a physics-based nonlinear simulator capturing hydrodynamics, underactuation, and coupled body–tail dynamics for scalable data generation, system identification, and controller development.
          - Built sim-to-real learning pipelines using Koopman learning and differentiable reinforcement learning (RL), combining large-scale simulation with limited real-world data to learn transferable dynamics models and control policies.
          - Developed online model adaptation that selectively incorporates informative streaming sensor data, supporting learning across changing dynamical regimes while reducing redundant data and computation.
          - Analyzed roll stability under periodic body motion and fluid interaction, identifying operating conditions that amplify roll oscillations.
        summary: 'Advisor: Prof. Phanindra Tallapragada'
      - company: "Virtual Prototyping of Ground Vehicle Systems Center (VIPR-GS)"
        position: "Graduate Research Assistant"
        start_date: "2020-01"
        end_date: "2021-08"
        location: "Clemson, SC, USA"
        highlights:
          - Energy management of multi-scale vehicle fleets
          - Designed energy-efficient planning and control strategies for UAV fleets operating in resource-constrained environments.
          - Applied MPC to UAV energy management, accounting for disturbances, wind effects, and morphed UAV configurations.
        summary: 'Advisor: Dr. Mohammad Naghnaeian'
