cv:
  name: "Kartik Loya"
  headline: "Robotics & Controls | Model Predictive Control | Physical Robot Testing"
  location: "Clemson, SC, USA"
  email: "Kloya@clemson.edu"
  social_networks:
    - network: "LinkedIn"
